{% extends "base.html" %}

{% block title %}Add Subject | StudyPlanController{% endblock %}

{% block content %}
<h1>Add Subject</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Subject name</label>
        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            required
        >
    </div>

    <div class="form-group">
        <label for="code">Subject code</label>
        <input
            type="text"
            id="code"
            name="code"
            maxlength="20"
            required
        >
    </div>

    <div class="form-group">
        <label for="colour">Display colour</label>
        <input
            type="color"
            id="colour"
            name="colour"
            value="#2563eb"
        >
    </div>

    <button type="submit">Save Subject</button>
    <a class="cancel-link" href="{{ url_for('subjects') }}">
        Cancel
    </a>
</form>
{% endblock %}
