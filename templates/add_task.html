{% extends "base.html" %}

{% block title %}
    Add Task | StudyPlanController
{% endblock %}

{% block content %}
<h1>Add Study Task</h1>

<p>
    Create a task and connect it to one of your subjects.
</p>

<form method="POST">
    <div class="form-group">
        <label for="title">Task title</label>

        <input
            type="text"
            id="title"
            name="title"
            maxlength="120"
            required
        >
    </div>

    <div class="form-group">
        <label for="subject_id">Subject</label>

        <select
            id="subject_id"
            name="subject_id"
            required
        >
            <option value="">
                Select a subject
            </option>

            {% for subject in subjects %}
                <option value="{{ subject.id }}">
                    {{ subject.code }}
                    -
                    {{ subject.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            name="description"
            rows="5"
        ></textarea>
    </div>

    <div class="form-group">
        <label for="due_date">Due date</label>

        <input
            type="date"
            id="due_date"
            name="due_date"
            required
        >
    </div>

    <div class="form-group">
        <label for="priority">Priority</label>

        <select
            id="priority"
            name="priority"
        >
            <option value="Low">Low</option>

            <option value="Medium" selected>
                Medium
            </option>

            <option value="High">High</option>
        </select>
    </div>

    <button type="submit">
        Save Task
    </button>

    <a
        class="cancel-link"
        href="{{ url_for('tasks') }}"
    >
        Cancel
    </a>
</form>
{% endblock %}
