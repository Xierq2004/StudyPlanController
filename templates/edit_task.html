{% extends "base.html" %}

{% block title %}Edit Task | StudyPlanController{% endblock %}

{% block content %}
<h1>Edit Study Task</h1>

<form method="POST">
    <div class="form-group">
        <label for="title">Task title</label>

        <input
            type="text"
            id="title"
            name="title"
            maxlength="120"
            value="{{ task.title }}"
            required
        >
    </div>

    <div class="form-group">
        <label for="subject_id">Subject</label>

        <select id="subject_id" name="subject_id" required>
            {% for subject in subjects %}
                <option
                    value="{{ subject.id }}"
                    {% if subject.id == task.subject_id %}selected{% endif %}
                >
                    {{ subject.code }} - {{ subject.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="description">Description</label>

        <textarea
            id="description"
            name="description"
            rows="5"
        >{{ task.description or "" }}</textarea>
    </div>

    <div class="form-group">
        <label for="due_date">Due date</label>

        <input
            type="date"
            id="due_date"
            name="due_date"
            value="{{ task.due_date.strftime('%Y-%m-%d') }}"
            required
        >
    </div>

    <div class="form-group">
        <label for="priority">Priority</label>

        <select id="priority" name="priority">
            <option
                value="Low"
                {% if task.priority == "Low" %}selected{% endif %}
            >
                Low
            </option>

            <option
                value="Medium"
                {% if task.priority == "Medium" %}selected{% endif %}
            >
                Medium
            </option>

            <option
                value="High"
                {% if task.priority == "High" %}selected{% endif %}
            >
                High
            </option>
        </select>
    </div>

    <button type="submit">Update Task</button>

    <a class="cancel-link" href="{{ url_for('tasks') }}">
        Cancel
    </a>
</form>
{% endblock %}
